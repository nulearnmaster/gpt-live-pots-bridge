<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111321">
  <title>GPT-Live · Pots 음성 연결</title>
  <link rel="stylesheet" href="/voice.css">
  <script type="module" src="/voice.mjs"></script>
</head>
<body>
  <main>
    <header><span class="brand">GPT-LIVE <span aria-hidden="true">/</span> POTS</span><span class="tag">개인용</span></header>
    <section class="card" aria-labelledby="title">
      <div class="orb" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1 id="title">음성 대화</h1>
      <p class="lead">버튼을 누르지 않고 대화하세요.<br>AI가 말하는 중에도 끼어들 수 있어요.</p>
      <p id="status" class="status" role="status" aria-live="polite">초대 확인 중…</p>
      <div class="cost"><strong>2분 후 종료 시도 · 예상 US$0.10</strong><span>종료 확인이 지연되면 요금이 추가될 수 있습니다. Pots 작업 비용은 별도입니다.</span></div>
      <div class="buttons">
        <button id="start" type="button" disabled>비용에 동의하고 시작</button>
        <button id="end" type="button" class="secondary" hidden>대화 끝내기</button>
        <button id="play" type="button" class="secondary" hidden>소리 켜기</button>
      </div>
      <audio id="audio" autoplay playsinline aria-hidden="true"></audio>
    </section>
    <footer>정차 중 시작해 주세요. 이어폰·차량 오디오는 휴대폰 설정에서 연결하세요. 화면을 잠그거나 브라우저를 벗어나면 대화가 끝날 수 있어요.</footer>
  </main>
</body>
</html>
